# .github/labels.yml
- name: "rfc: proposal"
  color: "5319e7"
  description: "Request for Comments: Proposed additions or changes to the UVTT v2 schema."

- name: "bug: compliance"
  color: "d93f0b"
  description: "Conformance validation mismatches, parser crashes, or schema bugs."

- name: "spec: schemas"
  color: "1d76db"
  description: "General modifications to any JSON schema file."

- name: "spec: manifest"
  color: "1d76db"
  description: "Related to global manifest.json, metadata, or grid topology."

- name: "spec: geometry"
  color: "006b75"
  description: "Related to geometry.json, vector lines, curves, or height properties."

- name: "spec: entities"
  color: "fbca04"
  description: "Related to entities.json (lights, events, audio, emitters, spawns)."

- name: "spec: assets"
  color: "e3c1fa"
  description: "Related to standalone assets.schema.json (Tokens, Audio, Props)."

- name: "parser: go"
  color: "00ADD8"
  description: "Modifications to the Go reference implementation."

- name: "parser: typescript"
  color: "3178C6"
  description: "Modifications to the TypeScript reference implementation."

- name: "project: ci-cd"
  color: "24292f"
  description: "Updates to GitHub Actions, automated tests, or labelers."

- name: "project: docs"
  color: "0075ca"
  description: "Updates to README, standard specification, or RFC documentation."

- name: "status: draft"
  color: "bfd4f2"
  description: "RFC or proposal currently being drafted by the author."

- name: "status: community-review"
  color: "0e8a16"
  description: "Open for community and VTT developer feedback."

- name: "status: approved"
  color: "0052cc"
  description: "Formally approved by the governance group and merged into the spec."

- name: "status: deferred"
  color: "cfd3d7"
  description: "RFC or proposal postponed, closed, or rejected."

- name: "status: implemented"
  color: "704214"
  description: "Changes are successfully integrated into the schemas and reference parsers."

- name: "area: security"
  color: "e99695"
  description: "Dual-File DRM (.uvtt2k), split-resolution cryptography, or Web Crypto integrations."
