name: UVTT v2 Core Schema & Conformance CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read

jobs:
  validate-schemas-and-conformance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Validation Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema cryptography PyJWT

      - name: Step 1 - Validate Schema Draft-07 Structural Validity
        run: |
          echo "=== Auditing UVTT v2 Draft-07 JSON Schemas ==="
          python -c "
          import json
          from jsonschema import Draft7Validator
          
          schemas = ['schemas/manifest.schema.json', 'schemas/geometry.schema.json', 'schemas/entities.schema.json']
          for schema_path in schemas:
              print(f'Validating schema structure: {schema_path}')
              with open(schema_path, 'r') as f:
                  schema_data = json.load(f)
              Draft7Validator.check_schema(schema_data)
          print('SUCCESS: All JSON schemas are syntactically valid Draft-07 meta-schemas!')
          "

      - name: Step 2 - Execute Master Conformance Test Suite
        run: |
          echo "=== Executing Consolidated Conformance Verification Engine ==="
          python tests/master-test-suite.py

      - name: Step 3 - Verify Go Reference Parser Compilation
        run: |
          echo "=== Auditing Go Reference Parser Compilation ==="
          if [ -d "reference-parsers/go/" ]; then
            cd reference-parsers/go/
            go env -w GO111MODULE=auto
            go build -v uvtt2_parser.go
          else
            echo "Go directory not found, skipping."
          fi
