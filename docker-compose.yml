version: '3.8'

services:
  # 1. Serverless Edge Emulator: emulates Cloudflare Workers using wrangler / Alpine-Node
  zks-clearinghouse:
    image: node:20-alpine
    container_name: uvtt2-zks-clearinghouse
    ports:
      - "8787:8787"
    environment:
      - NODE_ENV=development
      - RETAILER_MASTER_SECRET=RETAILER_SECRET_KEY_abc123xyz789
    volumes:
      - ./clearinghouse:/app
    working_dir: /app
    command: sh -c "npm install -g wrangler && wrangler dev --ip 0.0.0.0 --port 8787"
    networks:
      - uvtt2-network

  # 2. Storefront Ingestion API: Express wrapper running the re-signing pipeline
  storefront-api:
    image: node:20-alpine
    container_name: uvtt2-storefront-api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - RETAILER_MASTER_SECRET=RETAILER_SECRET_KEY_abc123xyz789
    volumes:
      - ./clearinghouse:/app
    working_dir: /app
    command: node publisher-resign-pipeline.js
    networks:
      - uvtt2-network

  # 3. Revocation Key Cache: Redis database storing blacklisted transactions
  revocation-cache:
    image: redis:7-alpine
    container_name: uvtt2-revocation-cache
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    networks:
      - uvtt2-network

  # 4. CI Test Runner: automated python conformance test container
  test-runner:
    image: python:3.12-alpine
    container_name: uvtt2-test-runner
    depends_on:
      - zks-clearinghouse
      - storefront-api
    volumes:
      - ./tests:/app
    working_dir: /app
    command: sh -c "pip install cryptography PyJWT && python master-test-suite.py"
    networks:
      - uvtt2-network

volumes:
  redis-data:

networks:
  uvtt2-network:
    driver: bridge
